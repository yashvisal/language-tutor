[project]
name = "language-tutor-agent"
version = "0.1.0"
description = "LiveKit Agents worker for the language tutor: realtime tutor voice, parallel STT, semantic analyzer, select-to-translate."
requires-python = ">=3.10,<3.14"
dependencies = [
    "livekit-agents[openai]~=1.6.10",
    "openai>=2.0.0,<3",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` is a flat module directory, not a package: the worker runs from inside
# it, so the tests import `clock`/`billing` the same way the worker does.
pythonpath = ["src"]
# Every async test here is an asyncio test; no per-test marker earns its keep.
asyncio_mode = "auto"
